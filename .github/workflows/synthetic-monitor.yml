name: Synthetic monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-monitor
  cancel-in-progress: false

jobs:
  public-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PERUM_SYNTHETIC_BASE_URL: ${{ vars.PERUM_SYNTHETIC_BASE_URL }}
      PERUM_SYNTHETIC_SCHOOL_PUBLIC_ID: ${{ vars.PERUM_SYNTHETIC_SCHOOL_PUBLIC_ID }}
      PERUM_SYNTHETIC_LANDING_URL: https://grsn-panel.ru
      PERUM_SYNTHETIC_SCHOOL_URL: https://school-1.grsn-panel.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: perum-core/requirements.txt
      - name: Install dependencies
        run: pip install -r perum-core/requirements.txt
      - name: Validate monitor configuration
        run: |
          test -n "$PERUM_SYNTHETIC_BASE_URL" || { printf '%s\n' 'Missing repository variable PERUM_SYNTHETIC_BASE_URL' >&2; exit 1; }
          test -n "$PERUM_SYNTHETIC_SCHOOL_PUBLIC_ID" || { printf '%s\n' 'Missing repository variable PERUM_SYNTHETIC_SCHOOL_PUBLIC_ID' >&2; exit 1; }
      - name: Check public endpoints
        id: core-surfaces
        continue-on-error: true
        working-directory: perum-core
        env:
          PYTHONPATH: .
        run: |
          python tools/pilot_evidence.py \
            --endpoint-synthetic \
            --base-url "$PERUM_SYNTHETIC_BASE_URL" \
            --school-public-id "$PERUM_SYNTHETIC_SCHOOL_PUBLIC_ID" \
            --output synthetic-monitor
      - name: Check organization and school public surfaces
        id: organization-surfaces
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import socket
          import urllib.request

          checks = (
              ("landing", "${{ env.PERUM_SYNTHETIC_LANDING_URL }}/", "организация тест"),
              ("school_health", "${{ env.PERUM_SYNTHETIC_SCHOOL_URL }}/health", '"status":"ok"'),
              ("school_login", "${{ env.PERUM_SYNTHETIC_SCHOOL_URL }}/login", "ПЭРУМ"),
          )
          for name, url, marker in checks:
              request = urllib.request.Request(url, headers={"User-Agent": "PERUM-Synthetic/1.0"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read(512 * 1024).decode("utf-8")
                  if response.status != 200 or marker not in body:
                      raise SystemExit(f"{name} failed")
              print(f"{name}=ok")
          for host in ("grsn-panel.ru", "school-1.grsn-panel.ru"):
              ipv6 = sorted({item[4][0] for item in socket.getaddrinfo(host, 443, socket.AF_INET6)})
              if ipv6:
                  raise SystemExit(f"{host} publishes unverified IPv6 edge addresses")
              print(f"{host}_ipv6=disabled")
          PY
      - name: Publish scheduled monitor decision
        if: always() && github.event_name == 'schedule'
        env:
          CORE_OUTCOME: ${{ steps.core-surfaces.outcome }}
          ORGANIZATION_OUTCOME: ${{ steps.organization-surfaces.outcome }}
        run: |
          {
            printf '## Synthetic monitor\n\n'
            printf '| Контур | Результат |\n'
            printf '|---|---|\n'
            printf '| Core health и discovery | `%s` |\n' "$CORE_OUTCOME"
            printf '| Organization и school surfaces | `%s` |\n' "$ORGANIZATION_OUTCOME"
            if [ "$CORE_OUTCOME" != success ] || [ "$ORGANIZATION_OUTCOME" != success ]; then
              printf '\n> Scheduled observation remains NO-GO. Evidence is retained without repeating hourly workflow-failure email; run the monitor manually for a fail-closed remediation gate.\n'
              printf '::warning::Synthetic monitor remains NO-GO; inspect the retained evidence artifact.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce manual monitor gate
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          CORE_OUTCOME: ${{ steps.core-surfaces.outcome }}
          ORGANIZATION_OUTCOME: ${{ steps.organization-surfaces.outcome }}
        run: |
          [ "$CORE_OUTCOME" = success ]
          [ "$ORGANIZATION_OUTCOME" = success ]
      - name: Upload monitor result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-endpoint-monitor
          path: perum-core/synthetic-monitor
          if-no-files-found: ignore
          retention-days: 14
