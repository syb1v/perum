name: Mobile release (temporary APK + unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to create
        required: true
        type: string
      build_environment:
        description: Runtime environment embedded in both mobile artifacts
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    environment: mobile-preview
    timeout-minutes: 60
    defaults:
      run:
        working-directory: perum-mobile
    env:
      EXPO_PUBLIC_BUILD_ENV: ${{ inputs.build_environment }}
      EXPO_PUBLIC_CORE_API_URL: ${{ vars.EXPO_PUBLIC_CORE_API_URL }}
      EXPO_PUBLIC_LINK_HOST: ${{ vars.EXPO_PUBLIC_LINK_HOST }}
      EXPO_PUBLIC_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check public build configuration
        run: |
          test -n "$EXPO_PUBLIC_PROJECT_ID" || { echo "EXPO_PROJECT_ID is not configured"; exit 1; }
          test -n "$EXPO_PUBLIC_CORE_API_URL" || { echo "EXPO_PUBLIC_CORE_API_URL is not configured"; exit 1; }
          test -n "$EXPO_PUBLIC_LINK_HOST" || { echo "EXPO_PUBLIC_LINK_HOST is not configured"; exit 1; }
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Run mobile preflight
        working-directory: .
        run: npm run preflight --workspace perum-mobile
      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Build standalone release APK
        working-directory: perum-mobile/android
        timeout-minutes: 50
        run: ./gradlew --no-daemon --console=plain --info --stacktrace --max-workers=2 :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
      - name: Copy Android artifact
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep 'assets/index.android.bundle'
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PERUM-android-preview.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-release-android-${{ inputs.release_tag }}
          path: PERUM-android-preview.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 45
    environment: mobile-preview
    defaults:
      run:
        working-directory: perum-mobile
    env:
      EXPO_PUBLIC_BUILD_ENV: ${{ inputs.build_environment }}
      EXPO_PUBLIC_CORE_API_URL: ${{ vars.EXPO_PUBLIC_CORE_API_URL }}
      EXPO_PUBLIC_LINK_HOST: ${{ vars.EXPO_PUBLIC_LINK_HOST }}
      EXPO_PUBLIC_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check public build configuration
        run: |
          test -n "$EXPO_PUBLIC_PROJECT_ID" || { echo "EXPO_PROJECT_ID is not configured"; exit 1; }
          test -n "$EXPO_PUBLIC_CORE_API_URL" || { echo "EXPO_PUBLIC_CORE_API_URL is not configured"; exit 1; }
          test -n "$EXPO_PUBLIC_LINK_HOST" || { echo "EXPO_PUBLIC_LINK_HOST is not configured"; exit 1; }
      - name: Select compatible Xcode
        run: |
          xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26.4*.app' -print -quit)"
          test -n "$xcode_app" || { echo "Xcode 26.4+ is not installed on this runner"; ls -d /Applications/Xcode*.app 2>/dev/null || true; exit 1; }
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Run mobile preflight
        working-directory: .
        run: npm run preflight --workspace perum-mobile
      - name: Generate iOS project
        run: CI=1 npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        run: pod install --project-directory=ios
      - name: Build unsigned archive
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace" || { echo "No iOS workspace found"; exit 1; }
          scheme="$(xcodebuild -list -json -workspace "$workspace" | jq -r '[.workspace.schemes[] | select(. == "PERUM")][0] // ([.workspace.schemes[] | select(startswith("Pods-") | not) | select(. != "EASClient")][0] // empty)')"
          test -n "$scheme" || { echo "No application Xcode scheme found"; exit 1; }
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/PERUM.xcarchive" \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Payload" "$GITHUB_WORKSPACE/PERUM-ios-unsigned.ipa"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          app="$(find "$GITHUB_WORKSPACE/PERUM.xcarchive" -type d -name '*.app' -print -quit)"
          test -n "$app" || { echo "No archived iOS app found"; exit 1; }
          cp -R "$app" "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE"
          ditto -c -k --sequesterRsrc --keepParent Payload PERUM-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-release-ios-${{ inputs.release_tag }}
          path: PERUM-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Create GitHub mobile release
    runs-on: ubuntu-latest
    needs: [android, ios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mobile-release-*
          path: release-assets
          merge-multiple: true
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'release_tag must match mobile-vX.Y.Z'; exit 1; }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_ENVIRONMENT: ${{ inputs.build_environment }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/PERUM-android-preview.apk \
            release-assets/PERUM-ios-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --title "PERUM Mobile $RELEASE_TAG" \
            --prerelease \
            --notes "Temporary mobile release ($BUILD_ENVIRONMENT). Android is a standalone universal Release APK signed with the Expo template test key, not a store release. iOS is an unsigned IPA and requires signing before device installation. Source: $GITHUB_SHA."
