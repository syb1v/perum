name: Scanner image candidates

on:
  push:
    branches: [main]
    paths:
      - "deploy/scanner/**"
      - ".dockerignore"
      - "perum-core/app/scanner_relay.py"
      - "perum-core/app/core/config.py"
      - "perum-core/app/services/scanner_stack.py"
      - "perum-tenant/Dockerfile"
      - "perum-tenant/requirements.txt"
      - "perum-tenant/app/modules/media/scanner.py"
      - ".github/workflows/scanner-images.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  scanner-candidates:
    name: Scanner image candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/scanner/relay/Dockerfile
          load: true
          push: false
          tags: perum-scanner-relay:candidate
          build-args: VCS_REF=${{ github.sha }}
      - name: Verify constrained runtime contract
        run: python deploy/scanner/verify_relay_image.py perum-scanner-relay:candidate
      - name: Build local clamd candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/scanner/clamd/Dockerfile
          load: true
          push: false
          tags: perum-clamd:candidate
          build-args: VCS_REF=${{ github.sha }}
      - name: Build production scanner test client
        uses: docker/build-push-action@v6
        with:
          context: perum-tenant
          load: true
          push: false
          tags: perum-tenant:scanner-test
      - name: Verify isolation, recreation, outages and EICAR
        run: python deploy/scanner/verify_clamd_topology.py perum-clamd:candidate perum-scanner-relay:candidate perum-tenant:scanner-test "$PWD/deploy/scanner/protocol_client.py" "$PWD/deploy/scanner/verify_signature_freshness.py" "$PWD/deploy/scanner/verify_scanner_fairness.py"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable candidate
        id: relay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/scanner/relay/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/perum-scanner-relay:git-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Build and publish immutable clamd candidate
        id: clamd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/scanner/clamd/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/perum-clamd:git-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Verify published digest
        env:
          RELAY_IMAGE: ghcr.io/${{ github.repository_owner }}/perum-scanner-relay
          RELAY_DIGEST: ${{ steps.relay.outputs.digest }}
          CLAMD_IMAGE: ghcr.io/${{ github.repository_owner }}/perum-clamd
          CLAMD_DIGEST: ${{ steps.clamd.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${RELAY_IMAGE}@${RELAY_DIGEST}"
          docker buildx imagetools inspect "${CLAMD_IMAGE}@${CLAMD_DIGEST}"
      - name: Record candidate handoff
        env:
          RELAY_IMAGE: ghcr.io/${{ github.repository_owner }}/perum-scanner-relay
          RELAY_DIGEST: ${{ steps.relay.outputs.digest }}
          CLAMD_IMAGE: ghcr.io/${{ github.repository_owner }}/perum-clamd
          CLAMD_DIGEST: ${{ steps.clamd.outputs.digest }}
        run: |
          python -c 'import json, os; print(json.dumps({"status":"candidate","source_commit":os.environ["GITHUB_SHA"],"relay":{"image":os.environ["RELAY_IMAGE"]+"@"+os.environ["RELAY_DIGEST"]},"clamd":{"image":os.environ["CLAMD_IMAGE"]+"@"+os.environ["CLAMD_DIGEST"]}}, sort_keys=True))' > scanner-image-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-relay-candidate-${{ github.sha }}
          path: scanner-image-candidate.json
          retention-days: 30
