name: EAS Preview

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Preview platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

concurrency:
  group: eas-preview-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: EAS preview (${{ inputs.platform }})
    runs-on: ubuntu-latest
    environment: mobile-preview
    defaults:
      run:
        working-directory: perum-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_CORE_API_URL: ${{ vars.EXPO_PUBLIC_CORE_API_URL }}
      EXPO_PUBLIC_LINK_HOST: ${{ vars.EXPO_PUBLIC_LINK_HOST }}
      EXPO_PUBLIC_BUILD_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check EAS configuration
        run: |
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN secret is not configured"; exit 1; }
          test -n "$EXPO_PUBLIC_PROJECT_ID" || { echo "EXPO_PROJECT_ID variable is not configured"; exit 1; }
          test -n "$EXPO_PUBLIC_CORE_API_URL" || { echo "EXPO_PUBLIC_CORE_API_URL variable is not configured"; exit 1; }
          test -n "$EXPO_PUBLIC_LINK_HOST" || { echo "EXPO_PUBLIC_LINK_HOST variable is not configured"; exit 1; }
      - name: Install deps
        working-directory: .
        run: npm ci
      - name: Verify mobile
        working-directory: .
        run: |
          npm run preflight --workspace perum-mobile
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 21.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify project linkage
        run: eas project:info --non-interactive
      - name: Trigger preview build
        run: eas build --platform "${{ inputs.platform }}" --profile preview --non-interactive --no-wait
