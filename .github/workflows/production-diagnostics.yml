name: Production diagnostics

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Collect bounded read-only host diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_SSH_HOST }}
          username: ${{ vars.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            printf '%s\n' '=== filesystem ==='
            df -h --output=source,size,used,avail,pcent,target / /var/lib/docker
            printf '%s\n' '=== memory ==='
            free -m
            printf '%s\n' '=== docker disk usage ==='
            docker system df
            printf '%s\n' '=== top-level disk usage ==='
            du -x -h --max-depth=1 /var/lib/docker /var/log 2>/dev/null | sort -h
            printf '%s\n' '=== containers ==='
            docker ps -a --format '{{.Names}}|{{.Status}}|{{.Image}}'
            printf '%s\n' '=== health ==='
            for container in perum_control_db perum_core perum_web; do
              docker inspect --format '{{.Name}}|status={{.State.Status}}|health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|exit={{.State.ExitCode}}|oom={{.State.OOMKilled}}|error={{.State.Error}}' "$container" 2>/dev/null || true
            done
            printf '%s\n' '=== database healthcheck evidence ==='
            docker inspect --format '{{range .State.Health.Log}}{{.Start}}|exit={{.ExitCode}}|{{printf "%.240s" .Output}}{{println}}{{end}}' perum_control_db 2>/dev/null || true
            docker exec perum_core python -c "from app.core.config import get_settings; s=get_settings(); print(f'cloudflare_token_configured={bool(s.CLOUDFLARE_API_TOKEN)} cloudflare_dns_enabled={s.CLOUDFLARE_DNS_ENABLED}')"
            docker exec perum_core python -c "import asyncio
            from sqlalchemy import select
            from app.core.db import SessionLocal
            from app.models import Organization, School, SchoolDomain, Subscription
            async def main():
              async with SessionLocal() as db:
                rows=(await db.execute(select(School, Organization).join(Organization, School.org_id == Organization.id).where(School.subdomain == 'school-1'))).all()
                print('discovery_school_rows=' + str(len(rows)))
                for school, org in rows:
                  domains=(await db.execute(select(SchoolDomain).where(SchoolDomain.school_id == school.id))).scalars().all()
                  primary=[d for d in domains if d.is_primary and d.status == 'active']
                  canonical=any(d.domain == 'school-1.grsn-panel.ru' for d in domains)
                  subscription=await db.scalar(select(Subscription).where(Subscription.org_id == org.id))
                  subscription_status=subscription.status if subscription else 'missing'
                  print(f'discovery_school_id={school.id} public_id={school.public_id} school_status={school.status} suspended_by={school.suspended_by} org_status={org.status} subscription_status={subscription_status} domains={len(domains)} primary_active={len(primary)} canonical_present={canonical}')
            asyncio.run(main())"
            printf '%s\n' '=== school edge reachability ==='
            timeout 10 curl -sS -o /dev/null -w 'school_https=%{http_code} connect=%{time_connect} total=%{time_total}\n' https://school-1.grsn-panel.ru/health || true
            timeout 10 curl -sS --resolve school-1.grsn-panel.ru:443:87.120.196.143 -o /dev/null -w 'school_origin_https=%{http_code} connect=%{time_connect} total=%{time_total}\n' https://school-1.grsn-panel.ru/health || true
            timeout 10 curl -sS -H 'Host: school-1.grsn-panel.ru' -o /dev/null -w 'school_origin_http=%{http_code} connect=%{time_connect} total=%{time_total}\n' http://87.120.196.143/health || true
            for port in 22 80 443; do
              timeout 5 bash -c "</dev/tcp/87.120.196.143/$port" >/dev/null 2>&1 && result=open || result=closed_or_timeout
              printf 'organization_node_port_%s=%s\n' "$port" "$result"
            done
  organization-node:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Collect bounded read-only node diagnostics through Core jump
        uses: appleboy/ssh-action@v1
        with:
          host: 87.120.196.143
          username: ${{ vars.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          proxy_host: ${{ vars.DEPLOY_SSH_HOST }}
          proxy_username: ${{ vars.DEPLOY_SSH_USER }}
          proxy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            df -h --output=source,size,used,avail,pcent,target / /var/lib/docker
            free -m
            docker system df
            docker ps -a --format '{{.Names}}|{{.Status}}|{{.Image}}'
            for container in perum_agent caddy school_sch1_app school_school-1_app; do
              docker inspect --format '{{.Name}}|status={{.State.Status}}|health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|exit={{.State.ExitCode}}|oom={{.State.OOMKilled}}|error={{.State.Error}}' "$container" 2>/dev/null || true
            done
            tenant_container=$(docker ps --filter 'name=school_.*_app' --format '{{.Names}}' | head -1)
            [ -n "$tenant_container" ] || { echo 'No running tenant app container found'; exit 0; }
            docker exec "$tenant_container" python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2)); print('tenant_local_health=' + str(data == {'status': 'ok'}).lower())"
            tenant_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$tenant_container")
            docker inspect --format 'tenant_networks={{range $name, $network := .NetworkSettings.Networks}}{{$name}}={{$network.IPAddress}} {{end}}' "$tenant_container"
            docker inspect --format 'caddy_networks={{range $name, $network := .NetworkSettings.Networks}}{{$name}}={{$network.IPAddress}} {{end}}' caddy
            timeout 5 docker exec caddy wget -qO- "http://${tenant_ip}:3000/health" >/dev/null && echo 'caddy_to_tenant=true' || echo 'caddy_to_tenant=false'
            docker exec caddy wget -qO- http://127.0.0.1:2019/config/ | python3 -c "import json,sys; root=json.load(sys.stdin); matches=[]
            def walk(value):
              if isinstance(value,dict):
                if 'school-1.grsn-panel.ru' in json.dumps(value) and ('reverse_proxy' in json.dumps(value) or 'upstreams' in value): matches.append(value)
                for child in value.values(): walk(child)
              elif isinstance(value,list):
                for child in value: walk(child)
            walk(root); print('school_route=' + json.dumps(matches[-1] if matches else None, ensure_ascii=True)[:1200])"
            printf '%s\n' '=== bounded application errors ==='
            for container in "$tenant_container" perum_web; do
              docker logs --since 10m --tail 300 "$container" 2>&1 | grep -E 'ERROR|Traceback|Internal Server Error|status.?500| 500 ' | tail -80 || true
            done
