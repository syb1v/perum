name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    name: perum-core (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: perum-core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: perum-core
        run: python -m pytest -q

  tenant-tests:
    name: perum-tenant (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: perum-tenant
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        working-directory: perum-tenant
        run: python -m pytest tests/unit -q

  web-typecheck:
    name: perum-web (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Check shared packages
        run: npm run typecheck
      - name: Test shared packages
        run: npm run test:shared
      - name: Audit production dependencies
        run: npm run audit:ci
      - name: Typecheck
        run: npm run typecheck:web

  mobile-checks:
    name: perum-mobile (tsc + tests + export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace perum-mobile
      - name: Run unit tests
        run: npm test --workspace perum-mobile
      - name: Validate Expo config
        run: npm run validate:config --workspace perum-mobile
      - name: Export Android bundle
        run: npm run export:android --workspace perum-mobile
      - name: Export iOS bundle
        run: npm run export:ios --workspace perum-mobile

  api-contracts:
    name: OpenAPI contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend deps
        run: pip install -r perum-core/requirements.txt -r perum-tenant/requirements.txt
      - name: Install workspace deps
        run: npm ci
      - name: Generate and verify contracts
        run: |
          npm run contracts:generate
          git diff --exit-code -- packages/api-schema/openapi packages/api-schema/generated
          npm run contracts:check
