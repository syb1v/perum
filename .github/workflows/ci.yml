name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    name: perum-core (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: perum-core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: perum-core
        run: python -m pytest -q

  tenant-tests:
    name: perum-tenant (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: perum-tenant
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        working-directory: perum-tenant
        run: python -m pytest tests/unit -q
      - name: Check Alembic single head
        working-directory: perum-tenant
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: SQLite migration smoke
        working-directory: perum-tenant
        run: python -m pytest tests/unit/test_migrations_sqlite.py -q
      - name: Academic offline and backfill gates
        working-directory: perum-tenant
        run: python -m pytest tests/unit/test_homework_semantics.py tests/unit/test_occurrence_backfill.py tests/unit/test_academic_archiving.py -q

  tenant-postgresql-scanner:
    name: perum-tenant (PostgreSQL scanner gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: perum_test
          POSTGRES_PASSWORD: perum_test
          POSTGRES_DB: perum_tenant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perum_test -d perum_tenant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://perum_test:perum_test@127.0.0.1:5432/perum_tenant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: perum-tenant
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: PostgreSQL scanner migration and fencing gate
        working-directory: perum-tenant
        run: python -m pytest tests/integration/test_scanner_postgresql.py -q

  web-typecheck:
    name: perum-web (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Check shared packages
        run: npm run typecheck
      - name: Test shared packages
        run: npm run test:shared
      - name: Audit production dependencies
        run: npm run audit:ci
      - name: Typecheck
        run: npm run typecheck:web
      - name: Production build
        run: npm run build:web

  mobile-checks:
    name: perum-mobile (tsc + tests + export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace perum-mobile
      - name: Run unit tests
        run: npm test --workspace perum-mobile
      - name: Validate Expo config
        run: npm run validate:config --workspace perum-mobile
      - name: Export Android bundle
        run: npm run export:android --workspace perum-mobile
      - name: Export iOS bundle
        run: npm run export:ios --workspace perum-mobile

  api-contracts:
    name: OpenAPI contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend deps
        run: pip install -r perum-core/requirements.txt -r perum-tenant/requirements.txt
      - name: Install workspace deps
        run: npm ci
      - name: Generate and verify contracts
        run: |
          npm run contracts:generate
          git diff --exit-code -- packages/api-schema/openapi packages/api-schema/generated
          npm run contracts:check

  tenant-release-contract:
    name: Tenant release descriptor contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core contract dependencies
        run: pip install -r perum-core/requirements.txt pytest
      - name: Validate release manifest and Core/Tenant OpenAPI parity
        working-directory: perum-core
        run: python -m pytest tests/test_release_manifest.py -q

  workflow-config:
    name: Workflow config smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse workflow YAML
        run: |
          pip install pyyaml
          python -c "import yaml; [yaml.safe_load(open(path)) for path in ('.github/workflows/ci.yml', '.github/workflows/release.yml')]"
