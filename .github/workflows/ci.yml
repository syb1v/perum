name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    name: perum-core (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: perum-core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: perum-core
        run: python -m pytest -q

  tenant-tests:
    name: perum-tenant (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: perum-tenant
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        working-directory: perum-tenant
        run: python -m pytest tests/unit -q
      - name: Check Alembic single head
        working-directory: perum-tenant
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: SQLite migration smoke
        working-directory: perum-tenant
        run: python -m pytest tests/unit/test_migrations_sqlite.py -q
      - name: Academic offline and backfill gates
        working-directory: perum-tenant
        run: python -m pytest tests/unit/test_homework_semantics.py tests/unit/test_occurrence_backfill.py tests/unit/test_academic_archiving.py -q

  tenant-postgresql-scanner:
    name: perum-tenant (PostgreSQL integration gates)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: perum_test
          POSTGRES_PASSWORD: perum_test
          POSTGRES_DB: perum_tenant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perum_test -d perum_tenant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://perum_test:perum_test@127.0.0.1:5432/perum_tenant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: perum-tenant
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: PostgreSQL integration gates
        working-directory: perum-tenant
        run: python -m pytest tests/integration/test_scanner_postgresql.py tests/integration/test_social_friends_postgresql.py tests/integration/test_academic_role_journey_postgresql.py -q

  web-typecheck:
    name: perum-web (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Check shared packages
        run: npm run typecheck
      - name: Test shared packages
        run: npm run test:shared
      - name: Typecheck
        run: npm run typecheck:web
      - name: Production build
        run: npm run build:web
      - name: Audit production dependencies
        run: npm run audit:ci -- perum-web

  web-academic-e2e:
    name: perum-web (academic role E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: perum_test
          POSTGRES_PASSWORD: perum_test
          POSTGRES_DB: perum_web_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perum_test -d perum_web_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://perum_test:perum_test@127.0.0.1:5432/perum_web_e2e
      E2E_BASE_URL: http://school.localhost:4173
      E2E_INTERNAL_TOKEN: e2e-internal-token
      E2E_TENANT_ORIGIN: http://127.0.0.1:3000
      E2E_WEB_ORIGIN: http://127.0.0.1:3001
      E2E_PROXY_PORT: 4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          pip install -r perum-tenant/requirements.txt
          npm ci
          npm exec --workspace perum-web -- playwright install --with-deps chromium
      - name: Prepare Tenant database
        working-directory: perum-tenant
        run: |
          alembic upgrade head
          python -m app.scripts.seed_defaults
      - name: Build Web
        run: npm run build:web
      - name: Start E2E contour
        env:
          ORG_SLUG: e2e
          ORG_NAME: E2E School
          SECRET_KEY: e2e-only-secret
          INTERNAL_RPC_TOKEN: e2e-internal-token
          TELEMETRY_INTERVAL_S: "0"
          SOCIAL_ROLLOUT_ENABLED: "false"
          MEDIA_ENABLED: "false"
          PUSH_DELIVERY_ENABLED: "false"
        run: |
          (cd perum-tenant && uvicorn app.main:app --host 127.0.0.1 --port 3000) > /tmp/perum-e2e-tenant.log 2>&1 &
          npm run start --workspace perum-web -- --hostname 127.0.0.1 --port 3001 > /tmp/perum-e2e-web.log 2>&1 &
          node perum-web/e2e/proxy.mjs > /tmp/perum-e2e-proxy.log 2>&1 &
      - name: Run academic role journey
        run: npm run test:e2e --workspace perum-web
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-academic-e2e-diagnostics
          path: |
            perum-web/test-results/
            /tmp/perum-e2e-tenant.log
            /tmp/perum-e2e-web.log
            /tmp/perum-e2e-proxy.log
          if-no-files-found: ignore
          retention-days: 7

  docker-builds:
    name: Production Docker build contexts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Core image
        uses: docker/build-push-action@v6
        with:
          context: perum-core
          file: perum-core/Dockerfile
          push: false
          tags: perum-core:ci
      - name: Build Tenant image
        uses: docker/build-push-action@v6
        with:
          context: perum-tenant
          file: perum-tenant/Dockerfile
          push: false
          tags: perum-tenant:ci
      - name: Build Web image from monorepo context
        uses: docker/build-push-action@v6
        with:
          context: .
          file: perum-web/Dockerfile
          push: false
          build-args: NEXT_PUBLIC_BASE_DOMAIN=xn--l1afdm2c.xn--p1ai
          tags: perum-web:ci
      - name: Validate production Compose merge
        run: |
          docker compose --env-file deploy/.env.prod.example \
            -f deploy/docker-compose.core.yml \
            -f deploy/docker-compose.prod.yml config --quiet

  mobile-checks:
    name: perum-mobile (tsc + tests + export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace perum-mobile
      - name: Run unit tests
        run: npm test --workspace perum-mobile
      - name: Validate Expo config
        run: npm run validate:config --workspace perum-mobile
      - name: Export Android bundle
        run: npm run export:android --workspace perum-mobile
      - name: Export iOS bundle
        run: npm run export:ios --workspace perum-mobile

  api-contracts:
    name: OpenAPI contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend deps
        run: pip install -r perum-core/requirements.txt -r perum-tenant/requirements.txt
      - name: Install workspace deps
        run: npm ci
      - name: Generate and verify contracts
        run: |
          npm run contracts:generate
          git diff --exit-code -- packages/api-schema/openapi packages/api-schema/generated
          npm run contracts:check

  tenant-release-contract:
    name: Tenant release descriptor contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core contract dependencies
        run: pip install -r perum-core/requirements.txt pytest
      - name: Validate release manifest and Core/Tenant OpenAPI parity
        working-directory: perum-core
        run: python -m pytest tests/test_release_manifest.py -q

  workflow-config:
    name: Workflow config smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse workflow YAML
        run: |
          pip install pyyaml
          python -c "import yaml; [yaml.safe_load(open(path)) for path in ('.github/workflows/ci.yml', '.github/workflows/release.yml', '.github/workflows/scanner-images.yml', '.github/workflows/synthetic-monitor.yml', '.github/workflows/production-diagnostics.yml')]"
      - name: Run deploy shell regressions
        run: bash deploy/tests/test_deploy_scripts.sh
