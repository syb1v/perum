name: Release (detect changes, build & push, register tenant release)

# Авто-релизы ПО КОМПОНЕНТАМ. На push в main определяется, ЧТО реально изменилось
# (perum-core / perum-tenant / perum-web), и собираются + пушатся в GHCR ТОЛЬКО
# изменённые образы (тег git-<sha> + latest). Так фронт, ядро и тенант обновляются
# независимо, и образ появляется ТОЛЬКО при реальном изменении кода.
#
# Для perum-tenant дополнительно: авто-changelog из git log + регистрация релиза в
# ядре (POST /api/ci/release), чтобы организации увидели обновление «по кнопке».
# Ядро отклонит релиз, чей образ совпадает с текущим → «пустой» OTA невозможен.
# Регистрация включается, только если задана переменная репозитория CORE_URL и
# секрет RELEASE_PUBLISH_TOKEN. См. docs/RELEASING.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      tenant: ${{ steps.filter.outputs.tenant }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'perum-core/**'
            web:
              - 'perum-web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.dockerignore'
            tenant:
              # OTA-релиз тенанта публикуется ТОЛЬКО при изменении кода тенанта.
              # ВНИМАНИЕ: negation-паттерны (`!...`) тут НЕ использовать — у paths-filter
              # OR-семантика, и `!perum-tenant/**/*.md` matchит почти любой файл (всё,
              # что не tenant-md), из-за чего tenant=true на любом коммите. От «пустых»
              # OTA защищает бэкенд (`publish_release_record` отклоняет тот же образ/коммит).
              - 'perum-tenant/**'

  tenant-release-contract:
    name: Tenant release descriptor contract gate
    needs: changes
    if: needs.changes.outputs.tenant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core contract dependencies
        run: pip install -r perum-core/requirements.txt pytest
      - name: Validate release manifest and Core/Tenant OpenAPI parity
        working-directory: perum-core
        run: python -m pytest tests/test_release_manifest.py -q

  build:
    needs: [changes, tenant-release-contract]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.tenant != 'true' || needs.tenant-release-contract.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: perum-core
            context: perum-core
            file: perum-core/Dockerfile
            changed: ${{ needs.changes.outputs.core }}
          - image: perum-tenant
            context: perum-tenant
            file: perum-tenant/Dockerfile
            changed: ${{ needs.changes.outputs.tenant }}
          - image: perum-web
            context: .
            file: perum-web/Dockerfile
            changed: ${{ needs.changes.outputs.web }}
    steps:
      - if: matrix.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Derive image tag from commit
        if: matrix.changed == 'true'
        id: meta
        run: echo "tag=git-${RELEASE_SHA::12}" >> "$GITHUB_OUTPUT"

      - if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Require configured production web domain
        if: matrix.changed == 'true' && matrix.image == 'perum-web'
        run: test -n '${{ vars.PUBLIC_BASE_DOMAIN }}'

      - name: Log in to GHCR
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # NEXT_PUBLIC_BASE_DOMAIN вшивается только в perum-web; для остальных
          # образов build-arg игнорируется. Домен берётся из переменной репозитория
          # PUBLIC_BASE_DOMAIN (если не задана — дефолт из Dockerfile).
          build-args: |
            NEXT_PUBLIC_BASE_DOMAIN=${{ vars.PUBLIC_BASE_DOMAIN }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest

  deploy:
    # Авто-деплой CONTROL PLANE (ядро + веб) на прод-сервер после пуша образов в GHCR.
    # Тенант (школы) НЕ трогаем — у него opt-in OTA по кнопке org_admin (см. ниже).
    # Запускается только если изменился core/web И включён деплой (vars.DEPLOY_ENABLED
    # == 'true'). Без переменной/секретов job пропускается — текущий прод не ломается.
    needs: [changes, build]
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (needs.changes.outputs.core == 'true' || needs.changes.outputs.web == 'true')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Pull свежие образы и перезапустить control plane по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ vars.DEPLOY_PATH || '/opt/perum' }}"
            RELEASE_SHA='${{ env.RELEASE_SHA }}'
            [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
            CORE_IMAGE="$(docker inspect -f '{{.Config.Image}}' perum_core 2>/dev/null)"
            WEB_IMAGE="$(docker inspect -f '{{.Config.Image}}' perum_web 2>/dev/null)"
            if [ '${{ needs.changes.outputs.core }}' = true ]; then
              CORE_IMAGE="ghcr.io/${{ github.repository_owner }}/perum-core:git-${RELEASE_SHA:0:12}"
            fi
            if [ '${{ needs.changes.outputs.web }}' = true ]; then
              WEB_IMAGE="ghcr.io/${{ github.repository_owner }}/perum-web:git-${RELEASE_SHA:0:12}"
            fi
            for image in "$CORE_IMAGE" "$WEB_IMAGE"; do
              [[ "$image" =~ @sha256:[0-9a-fA-F]{64}$ || "$image" =~ :git-[0-9a-fA-F]{12,}$ ]] || {
                echo "Refusing mutable production image ref: $image" >&2
                exit 1
              }
            done
            bash "${DEPLOY_PATH}/deploy/scripts/deploy-core.sh" \
              --update \
              --commit "$RELEASE_SHA" \
              --core-image "$CORE_IMAGE" \
              --web-image "$WEB_IMAGE" \
              --path "$DEPLOY_PATH"

  tenant-release:
    # Только если РЕАЛЬНО изменился код тенанта — тогда есть что выкатывать школам.
    needs: [changes, tenant-release-contract, build]
    if: needs.changes.outputs.tenant == 'true' && needs.tenant-release-contract.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0  # нужен git-лог для changelog

      - name: Build changelog + read semver from VERSION
        id: cl
        run: |
          # Образ остаётся на git-<sha> (immutable, реально пушится выше). Человеческая
          # версия (version_tag) — из perum-tenant/VERSION (семвер x.y.z). Чтобы выкатить
          # релиз, надо бампнуть VERSION: иначе ядро отклонит дубликат version_tag.
          IMAGE_TAG="git-${RELEASE_SHA::12}"
          VERSION="$(tr -d ' \t\n\r' < perum-tenant/VERSION 2>/dev/null || true)"
          [ -z "$VERSION" ] && VERSION="$IMAGE_TAG"
          RANGE="${RELEASE_SHA}^..${RELEASE_SHA}"
          if ! git rev-parse "${RELEASE_SHA}^" >/dev/null 2>&1; then RANGE="HEAD~20..HEAD"; fi
          CHANGELOG=$(git log --no-merges --pretty=format:'- %s' $RANGE -- perum-tenant | head -40)
          [ -z "$CHANGELOG" ] && CHANGELOG="- обновление тенанта ($VERSION)"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<CL_EOF"
            echo "$CHANGELOG"
            echo "CL_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Register tenant release in core (if configured)
        if: ${{ vars.CORE_URL != '' }}
        env:
          CORE_URL: ${{ vars.CORE_URL }}
          TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/perum-tenant:${{ steps.cl.outputs.image_tag }}
          TAG: ${{ steps.cl.outputs.version }}
          CHANGELOG: ${{ steps.cl.outputs.changelog }}
          SHA: ${{ env.RELEASE_SHA }}
        run: |
          MANIFEST=perum-tenant/mobile-descriptor.json
          jq -e type "$MANIFEST" >/dev/null
          jq -n --arg v "$TAG" --arg img "$IMAGE" --arg cl "$CHANGELOG" --arg sha "$SHA" --slurpfile manifest "$MANIFEST" \
            '{version_tag:$v, image:$img, changelog:$cl, source_commit:$sha, make_current:true, mobile_manifest:$manifest[0]}' \
          > release-payload.json
          status="$(curl -sS -o release-response.json -w '%{http_code}' -X POST "${CORE_URL%/}/api/ci/release" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data @release-payload.json)"
          if [ "$status" != 201 ]; then
            jq -c . release-response.json >&2 || true
            echo "tenant release registration failed: HTTP $status" >&2
            exit 1
          fi
          jq -e --arg image "$IMAGE" --arg sha "$SHA" '.image == $image and .source_commit == $sha and .is_current == true' release-response.json >/dev/null
          echo "tenant release registered: $TAG (image $IMAGE)"
